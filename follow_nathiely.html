<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NC Clinic — Follow Toxina & Preenchimento</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@100;200;300;400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #bca366;
    --gold-light: #d4b97a;
    --gold-pale: #e8d5a8;
    --gold-dim: #8a7548;
    --black: #0a0a0a;
    --black-soft: #111111;
    --black-card: #161616;
    --black-border: #222222;
    --white: #f5f0e8;
    --white-dim: #c8c0b0;
    --red: #c0605a;
    --red-bg: rgba(192,96,90,0.12);
    --amber: #c9a24b;
    --amber-bg: rgba(201,162,75,0.12);
    --green: #7fa876;
    --green-bg: rgba(127,168,118,0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'Archivo', sans-serif;
    font-weight: 200;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── LOGIN GATE ── */
  #gate {
    position: fixed;
    inset: 0;
    background: var(--black);
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 24px;
    text-align: center;
    padding: 24px;
  }
  #gate .logo-text { font-size: 40px; }
  #gate input {
    background: var(--black-card);
    border: 1px solid var(--gold-dim);
    color: var(--white);
    padding: 14px 18px;
    font-size: 16px;
    letter-spacing: 0.3em;
    text-align: center;
    width: 220px;
    font-family: 'Archivo', sans-serif;
  }
  #gate input:focus { outline: none; border-color: var(--gold); }
  #gate button {
    background: var(--gold);
    color: var(--black);
    border: none;
    padding: 14px 32px;
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    cursor: pointer;
    font-family: 'Archivo', sans-serif;
    font-weight: 400;
    transition: background 0.2s;
  }
  #gate button:hover { background: var(--gold-light); }
  #gate .err { color: var(--red); font-size: 12px; letter-spacing: 0.1em; height: 16px; }
  #app { display: none; }

  /* ── HEADER ── */
  header {
    text-align: center;
    padding: 48px 32px 32px;
    border-bottom: 1px solid var(--black-border);
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 600px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .logo-text {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 46px;
    letter-spacing: 0.18em;
    color: var(--gold);
    line-height: 1;
    margin-bottom: 6px;
  }
  .tagline {
    font-size: 10px;
    letter-spacing: 0.35em;
    color: var(--white-dim);
    text-transform: uppercase;
    margin-bottom: 22px;
  }
  .doc-badge {
    display: inline-block;
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
    border: 1px solid var(--gold-dim);
    padding: 6px 20px;
  }
  .internal-flag {
    margin-top: 14px;
    font-size: 9px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #5a5347;
  }

  /* ── LAYOUT ── */
  .container {
    max-width: 1080px;
    margin: 0 auto;
    padding: 36px 24px 80px;
  }

  /* ── SUMMARY BAR ── */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 32px;
  }
  @media (max-width: 640px) { .summary-grid { grid-template-columns: repeat(2, 1fr); } }
  .summary-card {
    background: var(--black-card);
    border: 1px solid var(--black-border);
    padding: 18px 16px;
    text-align: center;
  }
  .summary-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 34px;
    font-weight: 400;
    line-height: 1;
    margin-bottom: 6px;
  }
  .summary-label {
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--white-dim);
  }
  .summary-card.sc-total .summary-num { color: var(--gold); }
  .summary-card.sc-vencido .summary-num { color: var(--red); }
  .summary-card.sc-proximo .summary-num { color: var(--amber); }
  .summary-card.sc-emdia .summary-num { color: var(--green); }

  /* ── TABS ── */
  .tabs {
    display: flex;
    gap: 0;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--black-border);
  }
  .tab-btn {
    flex: 1;
    background: none;
    border: none;
    color: var(--white-dim);
    font-family: 'Archivo', sans-serif;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 16px 8px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .tab-btn.active {
    color: var(--gold);
    border-bottom-color: var(--gold);
  }
  .tab-btn:hover { color: var(--gold-pale); }

  /* ── CONTROLS ── */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 24px;
    align-items: center;
  }
  .search-input {
    flex: 1;
    min-width: 180px;
    background: var(--black-card);
    border: 1px solid var(--black-border);
    color: var(--white);
    padding: 11px 16px;
    font-size: 13px;
    font-family: 'Archivo', sans-serif;
  }
  .search-input:focus { outline: none; border-color: var(--gold-dim); }
  .filter-chip {
    background: var(--black-card);
    border: 1px solid var(--black-border);
    color: var(--white-dim);
    padding: 10px 16px;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    font-family: 'Archivo', sans-serif;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .filter-chip.active { color: var(--black); background: var(--gold); border-color: var(--gold); }
  .filter-chip[data-f="VENCIDO"].active { background: var(--red); border-color: var(--red); color: var(--white); }
  .filter-chip[data-f="Próximo do prazo"].active { background: var(--amber); border-color: var(--amber); color: var(--black); }
  .filter-chip[data-f="Em dia"].active { background: var(--green); border-color: var(--green); color: var(--black); }
  .sort-select {
    background: var(--black-card);
    border: 1px solid var(--black-border);
    color: var(--white-dim);
    padding: 10px 14px;
    font-size: 11px;
    font-family: 'Archivo', sans-serif;
    letter-spacing: 0.05em;
  }

  /* ── CARDS ── */
  .patient-list { display: flex; flex-direction: column; gap: 10px; }
  .p-card {
    background: var(--black-card);
    border: 1px solid var(--black-border);
    border-left: 3px solid var(--black-border);
    transition: border-color 0.2s;
    cursor: pointer;
  }
  .p-card.st-vencido { border-left-color: var(--red); }
  .p-card.st-proximo { border-left-color: var(--amber); }
  .p-card.st-emdia { border-left-color: var(--green); }
  .p-card:hover { border-color: #333; }
  .p-card-top {
    padding: 18px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .p-expand-hint {
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #5a5347;
    margin-top: 4px;
  }

  /* ── DETAIL PANEL ── */
  .p-detail-panel {
    display: none;
    border-top: 1px solid var(--black-border);
    padding: 18px 20px 20px;
    background: rgba(255,255,255,0.015);
  }
  .p-card.expanded .p-detail-panel { display: block; }
  .p-card.expanded { border-color: var(--gold-dim); }

  .stat-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 18px;
  }
  @media (max-width: 520px) { .stat-row { grid-template-columns: 1fr; } }
  .stat-box {
    background: var(--black-soft);
    border: 1px solid var(--black-border);
    padding: 12px 14px;
    text-align: center;
  }
  .stat-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    color: var(--gold);
    line-height: 1;
    margin-bottom: 4px;
  }
  .stat-lbl {
    font-size: 8.5px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--white-dim);
  }

  .history-label {
    font-size: 9px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin-bottom: 10px;
  }
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 260px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .history-list::-webkit-scrollbar { width: 5px; }
  .history-list::-webkit-scrollbar-thumb { background: var(--black-border); }
  .hist-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: var(--black-soft);
    border: 1px solid var(--black-border);
    font-size: 12px;
  }
  .hist-proc { color: var(--white); flex: 1; }
  .hist-meta { color: var(--white-dim); font-size: 10.5px; white-space: nowrap; }
  .hist-valor { color: var(--gold-pale); font-family: 'Cormorant Garamond', serif; font-size: 15px; min-width: 70px; text-align: right; }

  .p-main { flex: 1; min-width: 200px; }
  .p-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-weight: 400;
    color: var(--white);
    margin-bottom: 4px;
  }
  .p-detail {
    font-size: 12px;
    color: var(--white-dim);
    letter-spacing: 0.02em;
  }
  .p-detail strong { color: var(--gold-pale); font-weight: 300; }

  .p-status {
    text-align: right;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }
  .badge {
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 2px;
    white-space: nowrap;
  }
  .badge.vencido { background: var(--red-bg); color: var(--red); border: 1px solid var(--red); }
  .badge.proximo { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber); }
  .badge.emdia { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); }
  .p-days { font-size: 11px; color: var(--white-dim); }

  .p-actions { display: flex; gap: 8px; }
  .btn-wa {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: 1px solid var(--gold-dim);
    color: var(--gold-pale);
    padding: 8px 14px;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-decoration: none;
    font-family: 'Archivo', sans-serif;
    transition: all 0.2s;
  }
  .btn-wa:hover { background: var(--gold); color: var(--black); border-color: var(--gold); }

  /* ── WHATSAPP MODAL ── */
  .wa-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 500;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .wa-overlay.open { display: flex; }
  .wa-modal {
    background: var(--black-card);
    border: 1px solid var(--gold-dim);
    max-width: 480px;
    width: 100%;
    padding: 28px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .wa-modal-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    color: var(--gold);
    margin-bottom: 4px;
  }
  .wa-modal-sub {
    font-size: 11px;
    color: var(--white-dim);
    letter-spacing: 0.05em;
    margin-bottom: 18px;
  }
  .wa-textarea {
    width: 100%;
    min-height: 200px;
    background: var(--black-soft);
    border: 1px solid var(--black-border);
    color: var(--white);
    font-family: 'Archivo', sans-serif;
    font-size: 13.5px;
    line-height: 1.6;
    padding: 14px;
    resize: vertical;
  }
  .wa-textarea:focus { outline: none; border-color: var(--gold-dim); }
  .wa-modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    justify-content: flex-end;
  }
  .wa-btn-cancel {
    background: transparent;
    border: 1px solid var(--black-border);
    color: var(--white-dim);
    padding: 10px 18px;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    font-family: 'Archivo', sans-serif;
  }
  .wa-btn-cancel:hover { border-color: #444; }
  .wa-btn-send {
    background: var(--gold);
    border: none;
    color: var(--black);
    padding: 10px 20px;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    font-family: 'Archivo', sans-serif;
    font-weight: 400;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
  }
  .wa-btn-send:hover { background: var(--gold-light); }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--white-dim);
    font-size: 13px;
    letter-spacing: 0.05em;
  }

  .count-label {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #5a5347;
    margin-bottom: 16px;
  }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    padding: 32px 24px 48px;
    border-top: 1px solid var(--black-border);
    position: relative;
  }
  footer::after {
    content: '';
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 300px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
  }
  .footer-brand {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    letter-spacing: 0.2em;
    color: var(--gold-dim);
    margin-bottom: 6px;
  }
  .footer-sub {
    font-size: 9px;
    letter-spacing: 0.3em;
    color: #3a3530;
    text-transform: uppercase;
  }
</style>
</head>

</div>

<footer>

</div>

  </div>
</div>

function renderSummary() {
  const sub = DATA.filter(d => d.categoria === state.cat);
  const vencido = sub.filter(d => d.status === 'VENCIDO').length;
  const proximo = sub.filter(d => d.status === 'Próximo do prazo').length;
  const emdia = sub.filter(d => d.status === 'Em dia').length;
  const grid = document.getElementById('summaryGrid');
  grid.innerHTML = `
    <div class="summary-card sc-total"><div class="summary-num">${sub.length}</div><div class="summary-label">Total</div></div>
    <div class="summary-card sc-vencido"><div class="summary-num">${vencido}</div><div class="summary-label">Vencidas</div></div>
    <div class="summary-card sc-proximo"><div class="summary-num">${proximo}</div><div class="summary-label">Próx. do prazo</div></div>
    <div class="summary-card sc-emdia"><div class="summary-num">${emdia}</div><div class="summary-label">Em dia</div></div>
  `;
}

function diasDesde(dataStr) {
  // dataStr no formato dd/mm/yyyy
  const [d, m, y] = dataStr.split('/').map(Number);
  const dataProc = new Date(y, m - 1, d);
  const hoje = new Date();
  const diffMs = hoje - dataProc;
  return Math.max(0, Math.round(diffMs / (1000 * 60 * 60 * 24)));
}

function waMessage(nome, procedimento, dataStr) {
  const primeiroNome = nome.split(' ')[0];
  const dias = diasDesde(dataStr);
  return `Oi ${primeiroNome}! Aqui é a equipe da NC Clinic 💛

Já faz ${dias} dias desde o seu último ${procedimento} com a gente. Sabemos como a correria do dia a dia pode acabar te impedindo de remarcar, mas passamos aqui pra te lembrar que esse cuidado com você não pode ficar esquecido 😊

Esse mês estamos com uma campanha especial de Setembro — o Mês da Cliente NC — com condições incríveis pra você fazer seu retorno ou reaplicação.

Bora agendar? Me conta qual o melhor dia pra você!`;
}

let currentWaData = null;

function openWaModal(nome, wa, procedimento, dataStr) {
  currentWaData = { wa };
  document.getElementById('waModalName').textContent = nome;
  document.getElementById('waTextarea').value = waMessage(nome, procedimento, dataStr);
  document.getElementById('waOverlay').classList.add('open');
}

function closeWaModal() {
  document.getElementById('waOverlay').classList.remove('open');
  currentWaData = null;
}

function sendWaMessage() {
  if (!currentWaData) return;
  const text = document.getElementById('waTextarea').value;
  const link = `https://wa.me/${currentWaData.wa}?text=${encodeURIComponent(text)}`;
  window.open(link, '_blank', 'noopener');
  closeWaModal();
}

function renderList() {
  let sub = DATA.filter(d => d.categoria === state.cat);
  if (state.filter !== 'all') sub = sub.filter(d => d.status === state.filter);
  if (state.search.trim()) {
    const q = state.search.trim().toLowerCase();
    sub = sub.filter(d => d.nome.toLowerCase().includes(q));
  }
  if (state.sort === 'prazo_asc') sub.sort((a,b) => a.prazo_dias - b.prazo_dias);
  else if (state.sort === 'prazo_desc') sub.sort((a,b) => b.prazo_dias - a.prazo_dias);
  else sub.sort((a,b) => a.nome.localeCompare(b.nome));

  document.getElementById('countLabel').textContent = `${sub.length} paciente${sub.length===1?'':'s'} encontrada${sub.length===1?'':'s'}`;

  const list = document.getElementById('patientList');
  if (sub.length === 0) {
    list.innerHTML = `<div class="empty-state">Nenhuma paciente encontrada com esses filtros.</div>`;
    return;
  }

  list.innerHTML = sub.map((d, i) => {
    const sc = statusClass(d.status);
    const diasTxt = d.prazo_dias < 0
      ? `${Math.abs(d.prazo_dias)} dias vencido`
      : (d.prazo_dias <= 30 ? `faltam ${d.prazo_dias} dias` : `em dia (${d.prazo_dias}d de folga)`);
    const cardId = `card-${state.cat.replace(/[^a-zA-Z]/g,'')}-${i}`;
    const hist = HIST[d.nome];
    return `
      <div class="p-card st-${sc}" id="${cardId}" onclick="toggleCard('${cardId}', event)">
        <div class="p-card-top">
          <div class="p-main">
            <div class="p-name">${d.nome}</div>
            <div class="p-detail"><strong>${d.procedimento}</strong> · última vez em ${d.data} · ${d.meses} meses atrás</div>
            <div class="p-expand-hint">▸ clique para ver histórico completo</div>
          </div>
          <div class="p-status">
            <span class="badge ${sc}">${d.status}</span>
            <span class="p-days">${diasTxt}</span>
            <div class="p-actions">
              ${d.wa ? `<button class="btn-wa" onclick="event.stopPropagation(); openWaModal('${d.nome.replace(/'/g,"\\'")}', '${d.wa}', '${d.procedimento.replace(/'/g,"\\'")}', '${d.data}')">WhatsApp</button>` : `<span class="p-days">sem telefone</span>`}
            </div>
          </div>
        </div>
        <div class="p-detail-panel">
          ${renderHistPanel(hist)}
        </div>
      </div>
    `;
  }).join('');
}

function renderHistPanel(hist) {
  if (!hist || !hist.procedimentos || hist.procedimentos.length === 0) {
    return `<div class="p-days">Sem histórico adicional encontrado na base de faturamento.</div>`;
  }
  const totalFmt = hist.total_gasto.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
  const rows = hist.procedimentos.map(p => {
    const valorFmt = p.valor.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
    return `
      <div class="hist-row">
        <span class="hist-proc">${p.procedimento}</span>
        <span class="hist-meta">${p.data} · ${p.profissional}</span>
        <span class="hist-valor">R$ ${valorFmt}</span>
      </div>
    `;
  }).join('');
  return `
    <div class="stat-row">
      <div class="stat-box"><div class="stat-num">R$ ${totalFmt}</div><div class="stat-lbl">Total gasto no período</div></div>
      <div class="stat-box"><div class="stat-num">${hist.n_visitas}</div><div class="stat-lbl">Visitas à clínica</div></div>
      <div class="stat-box"><div class="stat-num">${hist.cliente_desde || '—'}</div><div class="stat-lbl">Cliente desde</div></div>
    </div>
    <div class="history-label">Histórico completo de procedimentos</div>
    <div class="history-list">${rows}</div>
  `;
}

function toggleCard(cardId, evt) {
  const card = document.getElementById(cardId);
  if (!card) return;
  card.classList.toggle('expanded');
}

function renderAll() { renderSummary(); renderList(); }

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.cat = btn.dataset.cat;
    renderAll();
  });
});

document.querySelectorAll('.filter-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    state.filter = chip.dataset.f;
    renderList();
  });
});

document.getElementById('searchInput').addEventListener('input', (e) => {
  state.search = e.target.value;
  renderList();
});

document.getElementById('sortSelect').addEventListener('change', (e) => {
  state.sort = e.target.value;
  renderList();
});

renderAll();

// ── password gate (conveniência, não segurança real) ──
function checkPw() {
  const val = document.getElementById('pw').value;
  if (val === '3606') {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    try { sessionStorage.setItem('nc_follow_ok','1'); } catch(e) {}
  } else {
    document.getElementById('pwErr').textContent = 'Senha incorreta';
  }
}
document.getElementById('pw').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') checkPw();
});
try {
  if (sessionStorage.getItem('nc_follow_ok') === '1') {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  }
} catch(e) {}
</script>
